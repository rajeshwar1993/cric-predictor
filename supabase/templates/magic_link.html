<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Bragg</title>
</head>
<body style="margin:0;padding:0;background-color:#06080F;font-family:'Helvetica Neue',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#06080F;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background-color:#111827;border-radius:14px;border:1px solid rgba(255,255,255,0.07);padding:40px;">
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <h1 style="margin:0;font-size:32px;font-weight:700;background:linear-gradient(135deg,#00E5FF,#FFB800);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Bragg</h1>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:16px;">
              <p style="margin:0;font-size:18px;color:#F1F5F9;font-weight:600;">Sign in to your account</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <p style="margin:0;font-size:14px;color:#94A3B8;line-height:1.6;">
                Click the button below to sign in. This link expires in 1 hour.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:linear-gradient(135deg,#00E5FF,#00B8D4);color:#06080F;font-size:14px;font-weight:600;text-decoration:none;padding:12px 28px;border-radius:10px;">
                Sign In to Bragg
              </a>
            </td>
          </tr>
          <tr>
            <td align="center">
              <p style="margin:0;font-size:12px;color:#475569;line-height:1.5;">
                If you didn't request this, you can safely ignore this email.<br>
                Not affiliated with BCCI, IPL, or any franchise.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
